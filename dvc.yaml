stages:
  train_model:
    cmd: python src/train.py --config params.yaml
    deps:
      - data/processed
      - src/train.py
      - src/models.py
      - src/data.py
      - src/utils.py
    params:
      - data
      - training
      - model
      - optimizer
      - loss
      - scheduler
      - augmentation
    outs:
      - models/best_model.pth
      - models/training_history.pth  
      - metrics/train_metrics.json  

  evaluate:
    cmd: python src/evaluate.py --model models/best_model.pth
    deps:
      - src/evaluate.py
      - models/best_model.pth
      - data/processed/swans_dataset
    metrics:
      - metrics/evaluation.json:
          cache: false
    plots:
      - plots/confusion_matrix.png:
          cache: false
  web:
    cmd: streamlit run src/web.py
    deps:
      - src/web.py
      - models/best_model.pth
      - params.yaml