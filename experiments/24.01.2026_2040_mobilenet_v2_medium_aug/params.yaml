augmentation:
  use_targeted_aug: true 
  magnitude: 7
data:
  batch_size: 8
  img_size: 224
  num_classes: 6
loss:
  label_smoothing: 0.1
  use_focal_loss: true
  focal_gamma: 2.0
  focal_alpha: [0.7, 0.5, 0.3, 0.7, 0.3, 0.7]
model:
  name: mobilenet_v2
  from_huggingface: false
  freeze_backbone: True
  dropout_rate: 0.2
optimizer:
  name: AdamW
  weight_decay: 0.01
scheduler:
  T_max: 80
  name: CosineAnnealingLR
training:
  epochs: 80
  gradient_clip: 1.0
  lr: 0.0008
  unfreeze_epoch: 2
  patience: 10
  min_epochs: 15

