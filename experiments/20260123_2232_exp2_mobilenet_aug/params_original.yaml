augmentation:
  use_randaugment: false
data:
  batch_size: 16
  img_size: 224
  num_classes: 6
loss:
  label_smoothing: 0.05
model:
  dropout_rate: 0.6
  freeze_backbone: true
  name: efficientnet_b0
optimizer:
  name: AdamW
  weight_decay: 0.001
scheduler:
  T_max: 80
  name: CosineAnnealingLR
training:
  epochs: 100
  gradient_clip: 1.0
  lr: 5.0e-05
  min_epochs: 20
  patience: 15
  unfreeze_epoch: 20
