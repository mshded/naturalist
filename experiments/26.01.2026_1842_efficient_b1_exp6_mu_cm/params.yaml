data:
  batch_size: 8
  img_size: 240
  num_classes: 6

model:
  name: "efficientnet_b1"
  dropout_rate: 0.25
  freeze_backbone: true

augmentation:
  brightness_range: [0.9, 1.1]
  contrast_range: [0.9, 1.1]
  saturation_range: [0.9, 1.1]
  hue_range: [-0.03, 0.03]
  rotation_degrees: 15
  horizontal_flip: true
  vertical_flip: false
  mixup_alpha: 0.2
  cutmix_alpha: 0.0
  apply_mixup_cutmix_prob: 0.3

loss:
  use_focal_loss: false
  focal_gamma: 1.2
  focal_alpha: [1.0, 2.0, 1.0, 3.0, 1.0, 1.0]
  label_smoothing: 0.05

training:
  lr: 0.0002
  epochs: 90
  gradient_clip: 1.0
  unfreeze_epoch: 10
  patience: 15
  min_epochs: 40

optimizer:
  name: "AdamW"
  weight_decay: 0.01

scheduler:
  name: "ReduceLROnPlateau"
  mode: "max"
  factor: 0.5
  patience: 8
  min_lr: 0.000001
