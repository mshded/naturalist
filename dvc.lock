    params:
      params.yaml:
        augmentation:
          brightness_range:
          - 0.85
          - 1.15
          contrast_range:
          - 0.9
          - 1.1
          saturation_range:
          - 0.9
          - 1.1
          hue_range:
          - -0.05
          - 0.05
          rotation_degrees: 10
          horizontal_flip: false
          vertical_flip: false
          mixup_alpha: 0.0
          cutmix_alpha: 0.0
          apply_mixup_cutmix_prob: 0.0
        data:
          batch_size: 8
          img_size: 224
          num_classes: 6
        loss:
          use_focal_loss: false
          label_smoothing: 0.05
        model:
          name: efficientnet_b0
          dropout_rate: 0.3
          freeze_backbone: false
        optimizer:
          name: AdamW
          weight_decay: 0.01
        scheduler:
          name: ReduceLROnPlateau
          mode: max
          factor: 0.5
          patience: 10
          min_lr: 1e-06
        training:
          lr: 0.0003
          epochs: 90
          gradient_clip: 1.0
          unfreeze_epoch: 10
          patience: 20
          min_epochs: 50
