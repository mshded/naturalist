schema: '2.0'
stages:
  train_model:
    cmd: python src/train.py --config params.yaml
    deps:
    - path: notebooks/data/processed
      hash: md5
      md5: 0f4ad19be8859fabf3120c4c340c48e9.dir
      size: 35759354
      nfiles: 306
    - path: src/data.py
      hash: md5
      md5: f4417e1b83db6056c815b74d9ed73acc
      size: 5057
    - path: src/models.py
      hash: md5
      md5: b02e0bb5268bd8775a2aedd56ae84e05
