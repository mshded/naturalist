    params:
      params.yaml:
        augmentation:
          brightness_range:
          - 0.85
          - 1.15
          contrast_range:
          - 0.85
          - 1.15
          saturation_range:
          - 0.85
          - 1.15
          hue_range:
          - -0.05
          - 0.05
          rotation_degrees: 20
          horizontal_flip: true
          vertical_flip: true
          mixup_alpha: 0.2
          cutmix_alpha: 0.5
          apply_mixup_cutmix_prob: 0.3
        data:
          batch_size: 8
          img_size: 240
          num_classes: 6
        loss:
          use_focal_loss: true
          focal_gamma: 1.5
          focal_alpha:
          - 1.0
          - 2.0
          - 1.0
          - 3.0
          - 1.0
          - 1.0
          label_smoothing: 0.0
        model:
          name: efficientnet_b1
          dropout_rate: 0.45
          freeze_backbone: true
        optimizer:
          name: AdamW
          weight_decay: 0.01
        scheduler:
          name: ReduceLROnPlateau
          mode: max
          factor: 0.5
          patience: 10
          min_lr: 1e-06
        training:
          lr: 0.0002
          epochs: 90
          gradient_clip: 1.0
          unfreeze_epoch: 15
          patience: 20
          min_epochs: 50
