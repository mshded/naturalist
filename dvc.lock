      size: 7296
    - path: src/utils.py
      hash: md5
      md5: 0fe211744d1d076279ec1d2e3687ef82
      size: 4922
    params:
      params.yaml:
        augmentation:
          use_strong_aug: true
          magnitude: 7
          special_classes:
            black_necked_swan:
              saturation_range:
              - 0.5
              - 1.5
              brightness_range:
              - 0.7
              - 1.3
            american_swan:
              random_perspective: true
              distortion_scale: 0.2
          brightness_range:
          - 0.7
          - 1.3
          saturation_range:
          - 0.8
          - 1.2
          hue_range:
          - -0.1
          - 0.1
          rotation_degrees: 20
        data:
          batch_size: 32
          img_size: 256
          num_classes: 6
        loss:
          label_smoothing: 0.1
          use_focal_loss: true
          focal_gamma: 1.5
          focal_alpha:
          - 1.2
          - 1.8
          - 1.0
          - 1.3
          - 0.8
          - 1.2
        model:
          name: mobilenet_v2
          from_huggingface: false
          freeze_backbone: true
          dropout_rate: 0.4
        optimizer:
          name: AdamW
          weight_decay: 0.01
        scheduler:
          T_max: 80
          name: CosineAnnealingLR
        training:
          epochs: 120
          gradient_clip: 1.0
          lr: 0.0006
          unfreeze_epoch: 8
          patience: 25
          min_epochs: 15
    outs:
    - path: metrics/train_metrics.json
      hash: md5
