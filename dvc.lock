          freeze_backbone: true
        optimizer:
          name: AdamW
          weight_decay: 0.005
        scheduler:
          name: ReduceLROnPlateau
          mode: max
          factor: 0.5
          patience: 10
          min_lr: 1e-06
        training:
          lr: 0.0005
          epochs: 160
          gradient_clip: 1.0
          unfreeze_epoch: 30
          patience: 35
          min_epochs: 50
