augmentation:
  use_strong_aug: true 
  magnitude: 7
data:
  batch_size: 8
  img_size: 224
  num_classes: 6
loss:
  label_smoothing: 0.1
model:
  name: efficientnet_b0
  from_huggingface: false
  freeze_backbone: True
  dropout_rate: 0.2
optimizer:
  name: AdamW
  weight_decay: 0.01
scheduler:
  T_max: 80
  name: CosineAnnealingLR
training:
  epochs: 50
  gradient_clip: 1.0
  lr: 0.001
  unfreeze_epoch: 2
  patience: 10
  min_epochs: 15

